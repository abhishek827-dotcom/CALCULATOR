<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elegant Calculator</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #1e1e2f, #3f3351, #864879);
        font-family: "Poppins", sans-serif;
    }

    .calc {
        width: 330px;
        padding: 20px;
        border-radius: 25px;
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(15px);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        animation: fadeIn 1.2s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .screen {
        width: 100%;
        height: 70px;
        border: none;
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(8px);
        font-size: 2rem;
        text-align: right;
        padding: 10px;
        color: white;
        margin-bottom: 20px;
    }

    .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
    }

    button {
        padding: 18px;
        border: none;
        border-radius: 18px;
        font-size: 1.2rem;
        font-weight: 600;
        color: white;
        background: rgba(255, 255, 255, 0.18);
        cursor: pointer;
        transition: 0.25s;
        backdrop-filter: blur(5px);
    }

    button:hover {
        transform: translateY(-4px);
        background: rgba(255, 255, 255, 0.35);
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.45);
    }

    .equal {
        background: #ff7b54;
    }
    .equal:hover {
        background: #ff9770;
    }
</style>
</head>

<body>

<div class="calc">
    <input type="text" class="screen" id="screen" disabled />

    <div class="buttons">
        <button onclick="clearScreen()">C</button>
        <button onclick="delChar()">DEL</button>
        <button onclick="press('%')">%</button>
        <button onclick="press('/')">÷</button>

        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
        <button onclick="press('*')">×</button>

        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button onclick="press('-')">−</button>

        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        <button onclick="press('+')">+</button>

        <button onclick="press('0')">0</button>
        <button onclick="press('.')">.</button>
        <button onclick="calculate()" class="equal">=</button>
    </div>
</div>

<script>
    function press(val) {
        document.getElementById("screen").value += val;
    }

    function clearScreen() {
        document.getElementById("screen").value = "";
    }

    function delChar() {
        let s = document.getElementById("screen").value;
        document.getElementById("screen").value = s.slice(0, -1);
    }

    function calculate() {
        try {
            let result = eval(document.getElementById("screen").value);
            document.getElementById("screen").value = result;
        } catch {
            document.getElementById("screen").value = "Error";
        }
    }
</script>

</body>
</html>
